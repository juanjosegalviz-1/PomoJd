<body><header class="topbar"><div class="logo"><div class="logo-mark">🍅</div> PomoJd</div><div class="topbar-actions"><button class="btn btn-icon" id="themeBtn" onclick="PomoUI.toggleTheme()">🌙</button></div></header>
<div class="shell"><nav class="sidebar"><div class="nav-section">Menú</div><a class="nav-link" data-page="timer" href="index.html">🍅 <span class="label">Temporizador</span><span class="dot"></span></a><a class="nav-link" data-page="tasks" href="tareas.html">✅ <span class="label">Tareas</span><span class="dot"></span></a><a class="nav-link" data-page="stats" href="stats.html">📊 <span class="label">Estadísticas</span><span class="dot"></span></a><a class="nav-link" data-page="settings" href="config.html">⚙️ <span class="label">Ajustes</span><span class="dot"></span></a></nav>

<div class="grid grid-2"><div class="card"><h3>Tiempos</h3>
<label>Foco (min)<input id="focusMin" type="number" min="1" max="120" class="input"></label><br><br>

<label>Descanso largo (min)<input id="longMin" type="number" min="5" max="60" class="input"></label><br><br>

<button class="btn btn-primary" id="saveTimes">Guardar</button></div>
<div><div class="card" style="margin-bottom:16px"><h3>Comportamiento</h3><div id="toggles"></div></div>
<div class="card"><h3>Datos</h3><p style="color:var(--text-muted);font-size:.9rem">Todo se guarda en IndexedDB (base de datos local en tu navegador). Puedes exportar o borrar.</p><div class="row"><button class="btn" id="expJson">Exportar JSON</button><button class="btn btn-ghost" id="wipe">Borrar todo</button></div></div></div></div>
